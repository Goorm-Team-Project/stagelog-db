name: ETL CI/CD Pipeline

# 1. 언제 실행할 것인가?
on:
  push:
    branches: [ "feature/cicd" ] # 지금 작업 중인 브랜치

jobs:
  build-and-push:
    runs-on: ubuntu-latest # GitHub이 빌드용 컴퓨터를 한 대 빌려줍니다.

    steps:
      # 2. 코드 가져오기
      - name: Checkout code
        uses: actions/checkout@v3

      # 3. 도커 허브 로그인 (비밀번호는 Secrets에서 가져옴)
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Get current time
        uses: josStorer/get-current-time@v2
        id: current-time
        with:
          format: YYYYMMDD-HHmm
          utcOffset: "+09:00" # 한국 시간 기준

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # 여기에 태그를 여러 개 적으면 도커 허브에 한 번에 여러 개가 올라갑니다!
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/stagelog-repo:etl
            ${{ secrets.DOCKERHUB_USERNAME }}/stagelog-repo:etl-${{ steps.current-time.outputs.formattedTime }}
  deploy:
    needs: build-and-push # 중요: 빌드가 성공해야만 배포를 시작합니다!
    runs-on: ubuntu-latest
    steps:
      - name: Get GitHub Action IP
        id: ip
        run: echo "ipv4=$(curl -s https://ifconfig.me)" >> $GITHUB_OUTPUT

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Add GitHub IP to Security Group
        run: |
          aws ec2 authorize-security-group-ingress \
            --group-id ${{ secrets.AWS_SG_ID }} \
            --protocol tcp --port 22 --cidr ${{ steps.ip.outputs.ipv4 }}/32

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # 1. 도커 로그인
            echo ${{ secrets.DOCKERHUB_TOKEN }} | sudo docker login -u ${{ secrets.DOCKERHUB_USERNAME }} --password-stdin
            
            # 2. 기존 ETL 컨테이너 교체
            sudo docker stop etl-container || true
            sudo docker rm etl-container || true
            
            # 3. 최신 이미지 반영
            sudo docker pull ${{ secrets.DOCKERHUB_USERNAME }}/stagelog-repo:etl
            
            # 4. 실행 (EC2에 미리 생성한 .env 사용)
            sudo docker run -d \
              --name etl-container \
              --env-file /home/ubuntu/.env \
              ${{ secrets.DOCKERHUB_USERNAME }}/stagelog-repo:etl
            
            # 5. 정리
            sudo docker image prune -f
            # (기존 배포 스크립트...)

      - name: Remove GitHub IP from Security Group
        if: always() # 배포가 실패하더라도 문은 반드시 닫아야 합니다!
        run: |
          aws ec2 revoke-security-group-ingress \
            --group-id ${{ secrets.AWS_SG_ID }} \
            --protocol tcp --port 22 --cidr ${{ steps.ip.outputs.ipv4 }}/32